<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng ký — EGSP Gaming Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/Login.css" />
  <style>
    :root {
      --primary-color: #4f46e5;
      --accent-light: #06b6d4;
      --bg-card: #f8fafc;
      --text-dark: #0f172a;
    }
  </style>
</head>
<body class="auth-page">

<header class="header">
  <div class="nav-inner">
    <div class="nav-left">
      <a href="index.html" class="logo">
        <div class="logo-mark"></div>
        <span>EGSP</span>
      </a>
    </div>
    <div class="nav-right">
      <a href="../DoAn/login.html" class="btn-ghost">Đăng nhập</a>
    </div>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card">

    <div class="auth-header">
      <div class="auth-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
      </div>
      <h1 class="auth-title">Tạo Tài Khoản Mới</h1>
      <p class="auth-sub">Gia nhập cộng đồng EGSP Gaming Hub</p>
    </div>

    <div class="auth-body">

      <div class="field-group">
        <label class="field-label">Họ và Tên</label>
        <div class="field-wrap">
          <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="text" class="field-input" id="regFullName" placeholder="Nguyễn Văn A" required />
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">Email</label>
        <div class="field-wrap">
          <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          <input type="email" class="field-input" id="regEmail" placeholder="email@example.com" required />
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">Tên Đăng Nhập</label>
        <div class="field-wrap">
          <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="text" class="field-input" id="regUsername" placeholder="username123" required />
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">Số Điện Thoại</label>
        <div class="field-wrap">
          <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.41 2 2 0 0 1 3.6 1.22h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 8.94a16 16 0 0 0 6.29 6.29l1.8-1.8a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          <input type="tel" class="field-input" id="regPhone" placeholder="0912345678" required />
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">Mật Khẩu</label>
        <div class="field-wrap">
          <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" class="field-input" id="regPassword" placeholder="Tối thiểu 8 ký tự" required />
        </div>
        <p class="hint-text">Mật khẩu phải có ít nhất 8 ký tự</p>
      </div>

      <div class="field-group">
        <label class="field-label">Xác Nhận Mật Khẩu</label>
        <div class="field-wrap">
          <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" class="field-input" id="regConfirmPassword" placeholder="Nhập lại mật khẩu" required />
        </div>
      </div>

      <div id="regErrorMsg" class="error-msg" style="display: none;"></div>

      <label class="check-label" style="margin-bottom:16px">
        <input type="checkbox" id="regAgree" required />
        <span>Tôi đồng ý với <a href="#">Điều khoản sử dụng</a> và <a href="#">Chính sách bảo mật</a></span>
      </label>

      <button class="btn-submit" id="regBtn" onclick="handleRegister()">Tạo Tài Khoản</button>

    </div>

    <div class="auth-footer">
      Đã có tài khoản? <a href="login.html">Đăng nhập ngay</a>
    </div>

  </div>
</div>

<script src="js/theme.js"></script>
<script src="js/register.js"></script>
</body>
</html>
